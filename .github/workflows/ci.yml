name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pratto:pratto@localhost:5432/pratto?schema=pratto_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pratto
          POSTGRES_USER: pratto
          POSTGRES_PASSWORD: pratto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pratto -d pratto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
