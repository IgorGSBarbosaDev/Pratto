name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pratto:pratto@localhost:55432/pratto?schema=pratto_test
      NODE_ENV: test
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PUBLIC_MENU_BASE_URL: http://localhost:3000
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: miniosecret
      MINIO_BUCKET: pratto-test
      MINIO_PUBLIC_URL: http://localhost:9000/pratto-test
      MAILPIT_SMTP_HOST: localhost
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_API_URL: http://localhost:8025
      MAIL_FROM: no-reply@pratto.local
      COOKIE_SECRET: ci-cookie-secret-with-at-least-thirty-two-characters
      COOKIE_SECURE: false
      SEED_ADMIN_PASSWORD: test-admin-password
      LOG_LEVEL: silent
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pratto
          POSTGRES_USER: pratto
          POSTGRES_PASSWORD: pratto
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pratto -d pratto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:test:reset
      - run: pnpm db:test:seed
      - run: pnpm --filter @pratto/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm format:check
