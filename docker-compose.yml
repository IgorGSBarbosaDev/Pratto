services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pratto
      POSTGRES_USER: pratto
      POSTGRES_PASSWORD: pratto
    ports:
      - '${PRATTO_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pratto -d pratto']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    profiles: ['test']
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pratto
      POSTGRES_USER: pratto
      POSTGRES_PASSWORD: pratto
    ports:
      - '55432:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pratto -d pratto']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - '${PRATTO_MINIO_PORT:-9000}:9000'
      - '${PRATTO_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '${PRATTO_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${PRATTO_MAILPIT_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v1/info']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_test_data:
  minio_data:
